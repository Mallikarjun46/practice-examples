services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5009"
    environment:
      REDIS_HOST: redis
    networks:
      - app-net
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - app-net

volumes:
  redisdata:

networks:
  app-net:
    driver: bridge
